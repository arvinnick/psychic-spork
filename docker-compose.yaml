services:
    app:
        build: .
        ports:
        - "8000:8000"
        env_file:
          - .env
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
        depends_on:
          db:
            condition: service_healthy
        volumes:
          - ./app:/code/app
    db:
        image: postgres:13
        env_file:
          - .env
        ports:
        - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
          interval: 5s
          timeout: 5s
          retries: 5

volumes:
    postgres_data:
      name: database_volume